[package]
name = "arivu-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
authors = ["Arivu contributors"]
description = "Native Ratatui terminal interface for Arivu"
publish = false

[dependencies]
anyhow = "1"
crossterm = { version = "0.28", features = ["bracketed-paste"] }
ratatui = { version = "0.29", features = ["crossterm", "unstable-rendered-line-info"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
xai-ratatui-inline = { git = "https://github.com/xai-org/grok-build", rev = "dd04f397b1d02f2272b092555669dfba1f01bc85" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
